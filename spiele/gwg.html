<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#113344">
  <title>NIVO Lernwelt · Wirtschaftsgüter einordnen und buchen</title>
  <style>
:root {
  color-scheme: light;
  --ink: #143344;
  --muted: #48626b;
  --teal: #006653;
  --line: #cbdcd9;
  --paper: #fff;
  font: 16px/1.5 system-ui, sans-serif;
  color: var(--ink);
  background: #edf5f3;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
.top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px max(5vw, calc((100vw - 1040px) / 2));
  border-bottom: 1px solid var(--line); background: var(--paper);
  color: var(--muted); font-size: .9rem; font-weight: 650; white-space: nowrap;
}
.top img { display: block; width: 100px; height: 41px; object-fit: contain; }
main { max-width: 1040px; margin: 0 auto; padding: clamp(20px, 4vw, 48px) 16px 22px; }
footer { max-width: 1040px; margin: 0 auto; padding: 0 16px 20px; color: var(--muted); font-size: .85rem; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1.1; letter-spacing: -.035em; }
h2 { font-size: clamp(1.2rem, 2.6vw, 1.6rem); line-height: 1.2; letter-spacing: -.015em; }
p + p { margin-top: 8px; }
.eyebrow { font-size: .85rem; font-weight: 750; color: var(--teal); margin-bottom: 12px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: clamp(18px, 3.2vw, 36px); }
.intro { max-width: 710px; }
.intro h1 + p { margin-top: 16px; }
.action { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.button, button {
  display: inline-flex; align-items: center; justify-content: center; min-height: 50px;
  border-radius: 9px; border: 1px solid var(--line); padding: 10px 18px;
  background: var(--paper); color: var(--ink); font: inherit; font-weight: 680;
  text-decoration: none; cursor: pointer;
}
.button:hover, button:hover { border-color: var(--teal); background: #eaf7f2; }
.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
.primary:hover { background: #004f42; }
button:disabled { opacity: .65; cursor: default; background: #f4f7f6; }
:focus-visible { outline: 3px solid #2676c1; outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.meter { height: 6px; display: flex; gap: 4px; margin-bottom: 18px; }
.meter span { flex: 1; border-radius: 10px; background: #d3e3df; }
.meter .begonnen { background: #16866f; }
.spiel { display: grid; grid-template-columns: 0.9fr 1.1fr; align-items: start; gap: 16px; }
.objekt { display: block; width: 100%; height: clamp(130px, 20vw, 215px); object-fit: contain; background: #faf9f6; border-radius: 11px; margin-bottom: 14px; }
.preise { margin: 12px 0 0; font-variant-numeric: tabular-nums; }
.preise dt { color: var(--muted); font-size: .84rem; }
.preise dd { margin: 1px 0 0; font-weight: 650; }
.preise dd + dt { margin-top: 8px; }
.schritt { color: var(--muted); font-size: .86rem; font-weight: 650; margin-bottom: 8px; }
.optionen { display: grid; gap: 8px; margin-top: 16px; }
.optionen button { justify-content: flex-start; text-align: left; }
.optionen .buchung { align-items: flex-start; flex-direction: column; gap: 2px; }
.buchung span + span { color: var(--muted); font-size: .88rem; font-weight: 450; }
.optionen.kurz { grid-template-columns: 1fr 1fr; }
.optionen button[aria-invalid="true"] { border-color: #a64b21; background: #fff6ee; }
#hinweis:empty { display: none; }
#hinweis { margin-top: 13px; padding: 10px 12px; border-radius: 8px; background: #fff4e8; color: #75330e; }
.ergebnis { margin-top: 12px; }
dialog {
  max-width: min(470px, calc(100vw - 32px)); padding: clamp(18px, 4vw, 28px);
  border: 1px solid var(--line); border-radius: 16px; color: var(--ink);
}
dialog::backdrop { background: #14334485; }
dialog p { margin-top: 12px; }
@media (max-width: 640px) {
  .spiel { grid-template-columns: 1fr; gap: 10px; }
  .sache { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 12px; }
  .sache h2 { font-size: 1.05rem; }
  .objekt { height: 86px; margin: 0; }
  .preise { margin-top: 6px; font-size: .88rem; }
  .preise dt { font-size: .76rem; }
}
@media (max-width: 365px) {
  .sache { grid-template-columns: 70px 1fr; gap: 9px; }
  .panel { padding: 15px; }
}

.detail { color: var(--muted); margin-top: 5px; font-size: .88rem; }

[hidden] { display: none !important; }
.buchungsfall { max-width: 880px; }
.buchungsfall h1 { font-size: clamp(1.65rem, 4vw, 2.4rem); }
.buchungsbeleg {
  display: grid; grid-template-columns: minmax(100px, 230px) minmax(0, 1fr);
  align-items: center; gap: clamp(12px, 3vw, 26px); margin-bottom: 24px;
  padding: clamp(12px, 2vw, 20px); background: #edf5f3;
  border: 1px solid var(--line); border-radius: 12px;
}
.buchungsbeleg .objekt { height: clamp(90px, 23vw, 165px); margin: 0; }
.geschaeftsfall { margin-top: 10px; }
.vorgegebene-betraege {
  display: flex; flex-wrap: wrap; gap: 5px 16px; margin: 10px 0 0;
}
.vorgegebene-betraege dt { color: var(--muted); font-size: .82rem; }
.vorgegebene-betraege dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.buchungssatz {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: clamp(9px, 2.6vw, 24px); margin-top: 20px;
}
.buchungsseite { min-width: 0; margin: 0; padding: 0; border: 0; }
.buchungsseite legend { font-size: 1.25rem; line-height: 1.4; font-weight: 750; padding: 0; margin-bottom: 10px; }
.buchungs-an { align-self: start; margin-top: 70px; line-height: 24px; font-weight: 750; }
.buchungszeile {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start; gap: 9px;
}
.buchungszeile + .buchungszeile { margin-top: 14px; }
.feldeingabe label { display: block; margin-bottom: 4px; font-size: .85rem; line-height: 1.3; color: var(--muted); }
.feldeingabe input, .feldeingabe select {
  display: block; width: 100%; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--paper); color: var(--ink); padding: 8px; font: inherit;
}
.feldeingabe [aria-invalid="true"] { border-color: #a64b21; background: #fff6ee; }
.feldeingabe input { text-align: right; font-variant-numeric: tabular-nums; }
.feldhinweis { display: block; margin-top: 3px; color: #75330e; font-size: .85rem; }
.buchungsfeedback:empty { display: none; }
.buchungsfeedback { margin-top: 14px; color: #75330e; }
.buchungsfeedback.gebucht { color: var(--teal); font-weight: 750; }
.buchungsaktionen { justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 16px; }
.nur-screenreader {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
@media (max-width: 560px) {
  .buchungsbeleg { grid-template-columns: 1fr; }
  .buchungsbeleg .objekt { width: min(100%, 240px); margin-inline: auto; }
  .buchungszeile { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .feldeingabe input, .feldeingabe select { padding-inline: 5px; }
}
</style>

function frage(typ, kriterium = 0) {
  const fall = faelle[index];

  if (typ === "preis") {

  } else if (typ === "kriterium") {
    schritt = `Zuordnung zu den geringwertigen Wirtschaftsgütern (GWG) · ${kriterium + 1} von 3`;
    text = kriterien[kriterium];

    optionen = konten;

function ergebnis() {
  const fall = faelle[index];

function betragInCent(eingabe) {
  const betrag = eingabe.trim().replace(/\s*€$/, "").trimEnd();
  if (!/^(?:[0-9]+|[0-9]{1,3}(?:\.[0-9]{3})+)(?:,[0-9]{1,2})?$/.test(betrag)) return null;
  const [euro, cent = ""] = betrag.replaceAll(".", "").split(",");
  const summe = Number(euro) * 100 + Number(cent.padEnd(2, "0"));
  return Number.isSafeInteger(summe) ? summe : null;
}

function buchungPruefen(fall, betraege, zeilen, formular, feedback) {
  const sachkonto = {
    konto: fall.konto,
    cent: betraege.netto,
    kontohinweis: fall.sachhinweis,
    betragshinweis: fall.nettohinweis || "Übernimm den vorgegebenen Nettobetrag."
  };
  const vorsteuer = {
    konto: "2600", cent: betraege.vorsteuer,
    kontohinweis: "Auf welches Konto kommt die Umsatzsteuer aus Sicht des Käufers?",
    betragshinweis: "Übernimm den vorgegebenen Vorsteuerbetrag."
  };
  const haben = {
    konto: fall.zahlung, cent: betraege.brutto,
    kontohinweis: zahlungshinweise[fall.zahlung],
    betragshinweis: "Übernimm den vorgegebenen Bruttobetrag."
  };

  const bewertung = erwartung => erwartung.reduce((punkte, loesung, i) =>
    punkte + 2 * Number(zeilen[i].konto.value === loesung.konto)
      + Number(betragInCent(zeilen[i].betrag.value) === loesung.cent), 0);
  const standard = [sachkonto, vorsteuer, haben];
  const umgekehrt = [vorsteuer, sachkonto, haben];
  const loesung = bewertung(umgekehrt) > bewertung(standard) ? umgekehrt : standard;

  let richtig = true;
  zeilen.forEach(({ konto, betrag }, i) => {
    const erwartet = loesung[i];
    const cent = betragInCent(betrag.value);
    const kontofehler = konto.value !== erwartet.konto
      ? (konto.value ? erwartet.kontohinweis : "Wähle ein Konto aus.") : "";
    const betragfehler = cent !== erwartet.cent
      ? (cent === null ? "Gib einen Betrag ein, zum Beispiel 1000,00." : erwartet.betragshinweis) : "";
    for (const [feld, fehler] of [[konto, kontofehler], [betrag, betragfehler]]) {
      const hinweis = formular.querySelector(`#${feld.id}-hinweis`);
      hinweis.textContent = fehler;
      hinweis.hidden = !fehler;
      feld.toggleAttribute("aria-invalid", !!fehler);
      if (fehler) {
        feld.setAttribute("aria-invalid", "true");
        richtig = false;
      }
    }
  });
  feedback.textContent = richtig ? "👍 Richtig gebucht!" : "Schau dir die Hinweise an und prüfe deine Eingaben erneut.";
  feedback.classList.toggle("gebucht", richtig);
  if (!richtig) formular.querySelector('[aria-invalid="true"]').focus();
  return richtig;
}

    <div class="action">
      ${zusatzFertig ? "" : '<button id="buchung-zusatz" class="primary" type="button">Zusatzaufgaben starten</button>'}
      <button id="buchung-zurueck" type="button">Zurück zur Aufgabenstartseite</button>
    </div>
    ${zusatzFertig ? "" : `<dialog aria-labelledby="buchung-dialog-titel">
      <h2 id="buchung-dialog-titel">Ohne Zusatzaufgaben zur Startseite?</h2>
      <p>Du kannst die Zusatzaufgaben später von der Startseite aus starten.</p>
      <form class="action" method="dialog">
        <button class="primary" value="bleiben" autofocus>Hierbleiben</button>
        <button value="zurueck">Ja, zur Startseite</button>
      </form>
    </dialog>`}
  </section>`);
  ansicht.querySelector("#buchung-zusatz")?.addEventListener("click", () => buchungsfall(buchungspflicht));
  const dialog = ansicht.querySelector("dialog");
  ansicht.querySelector("#buchung-zurueck").addEventListener("click", () => {
    if (!dialog) {
      buchungsstart(true);
      return;
    }
    dialog.returnValue = "";
    dialog.showModal();
  });
  dialog?.addEventListener("close", () => {
    if (dialog.returnValue === "zurueck") buchungsstart(true);
  });
}

if (aufgabe === "2") buchungsstart();
</script>
</body>
</html>
