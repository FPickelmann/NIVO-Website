<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buchungskreislauf | NIVO Lernwelt</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f7;color:#082d53;font-family:system-ui,sans-serif}main{max-width:820px;margin:auto;padding:28px 20px 45px}.brand{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand img{width:160px;max-height:80px;object-fit:contain}.brand a{color:#075c82;font-weight:650}h1{font-size:clamp(30px,6vw,44px);margin:28px 0 10px}p{line-height:1.5}ol{padding:0;list-style:none;display:grid;gap:10px;margin:26px 0}li{display:flex;align-items:center;gap:14px;background:white;border:2px solid #d4e4e8;border-radius:14px;padding:12px;min-height:74px}.position{display:grid;place-items:center;background:#e7f3f5;border-radius:50%;width:35px;height:35px;flex-shrink:0;font-weight:750}.label{flex:1;font-size:clamp(16px,3vw,20px);font-weight:600}.move{display:flex;gap:7px}button{font:inherit;cursor:pointer;border:2px solid #0b668e;border-radius:9px;color:#082d53;background:white;min-height:44px;padding:9px 15px}button:focus-visible,a:focus-visible{outline:3px solid #e68a21;outline-offset:3px}button:disabled{opacity:.35;cursor:default}.controls{display:flex;flex-wrap:wrap;gap:12px}.primary{background:#086b94;color:white;font-weight:700}.success li{border-color:#278b4a;background:#e5f6e9}.success .position{background:#bddfc6}.failure li{border-color:#bd4545;background:#fff0f0}#feedback{min-height:38px;font-size:22px;font-weight:750;margin-top:20px}.success-text{color:#20753c}.failure-text{color:#a52d2d}footer{font-size:13px;color:#607680;margin-top:30px}@media(max-width:480px){.move{flex-direction:column}.move button{padding:5px 12px}li{gap:9px}.brand img{width:120px}}
</style></head><body><main><header class="brand"><img src="https://fpickelmann.github.io/NIVO-Website/assets/nivo-logo.png" alt="NIVO"><a href="https://fpickelmann.github.io/NIVO-Website/#/lernwelt">Zur NIVO Lernwelt</a></header><h1>Buchungskreislauf</h1><p>Bringe die sieben Schritte in die richtige Reihenfolge. Verschiebe sie mit den Pfeilen und prüfe anschließend deine Lösung.</p><ol id="steps" aria-label="Schritte des Buchungskreislaufs"></ol><div class="controls"><button class="primary" id="check">Reihenfolge prüfen</button><button id="restart">Neu mischen</button></div><p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p><footer>NIVO Lernwelt · Betriebswirtschaftslehre/Rechnungswesen</footer></main>
<script>
const steps=['Erstellung der Eröffnungsbilanz','Eröffnung der Bestandskonten','Laufende Buchungen','Abschluss der Erfolgskonten','Abschluss des GUV-Kontos','Abschluss der Bestandskonten','Erstellung der Schlussbilanz'];
let order=[];const list=document.getElementById('steps'),feedback=document.getElementById('feedback');
function isCorrect(a){return a.every((id,i)=>id===i)}
function resetFeedback(){list.className='';feedback.className='';feedback.textContent=''}
function render(focus){list.replaceChildren();order.forEach((id,i)=>{const li=document.createElement('li'),pos=document.createElement('span'),label=document.createElement('span'),moves=document.createElement('div');pos.className='position';pos.textContent=i+1;label.className='label';label.textContent=steps[id];moves.className='move';[-1,1].forEach(delta=>{const b=document.createElement('button');b.type='button';b.textContent=delta===-1?'↑':'↓';b.dataset.id=id;b.dataset.direction=delta;b.disabled=i+delta<0||i+delta>=order.length;b.setAttribute('aria-label',steps[id]+(delta===-1?' nach oben verschieben':' nach unten verschieben'));b.onclick=()=>{const j=i+delta;[order[i],order[j]]=[order[j],order[i]];resetFeedback();render({id,delta})};moves.append(b)});li.append(pos,label,moves);list.append(li)});if(focus){const b=list.querySelector(`button[data-id="${focus.id}"][data-direction="${focus.delta}"]`);if(b&&!b.disabled)b.focus();else list.querySelector(`button[data-id="${focus.id}"]:not(:disabled)`)?.focus()}}
function shuffle(){order=steps.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}if(isCorrect(order))[order[0],order[1]]=[order[1],order[0]];resetFeedback();render()}
document.getElementById('check').onclick=()=>{const ok=isCorrect(order);list.className=ok?'success':'failure';feedback.className=ok?'success-text':'failure-text';feedback.textContent=ok?'Gut gemacht! Die Reihenfolge ist richtig.':'Probiere es nochmal.'};document.getElementById('restart').onclick=shuffle;shuffle();
</script></body></html>
