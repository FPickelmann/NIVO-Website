const tasks=[
{title:'Wozu dient das Privatkonto?',group:'Grundlagen',story:'Emma entdeckt in der Buchführung von NIVO das Konto 3001 P. Sie möchte wissen, wozu es dient.',question:'Welche Aussage trifft zu? Wähle eine Antwort aus.',type:'choice',options:['Auf dem Privatkonto werden private Entnahmen und Einlagen von Felix Neumann erfasst.','Auf dem Privatkonto werden ausschließlich die Löhne aller NIVO-Beschäftigten erfasst.','Auf dem Privatkonto werden alle betrieblichen Umsatzerlöse gesammelt.','Auf dem Privatkonto werden ausschließlich Rechnungen von NIVO-Kunden erfasst.'],answer:'0',tips:['Überlege, welche Vorgänge zwischen Felix Neumanns Privatbereich und dem Unternehmen stattfinden können.','Suche die Antwort, die sowohl Entnahmen als auch Einlagen berücksichtigt.'],solution:'3001 P erfasst Privatentnahmen und Privateinlagen. Es ist ein Unterkonto des Eigenkapitalkontos.'},
{title:'Privat oder betrieblich?',group:'Grundlagen',story:'Felix Neumann bezahlt seine private Mitgliedschaft im Fitnessstudio über das Geschäftsbankkonto von NIVO.',type:'tf',question:'„Die Zahlung wird als betrieblicher Aufwand gebucht und vermindert den Gewinn von NIVO.“',options:['Die Mitgliedschaft ist privat. Die Zahlung ist eine Privatentnahme und wird erfolgsneutral erfasst.','Jede Zahlung vom Geschäftsbankkonto ist automatisch eine Privateinlage.','Die Zahlung ist betrieblicher Aufwand, weil sie über das Geschäftsbankkonto erfolgt.','Die Zahlung verändert weder Bankguthaben noch Eigenkapital.'],tips:['Überlege, ob Felix die Mitgliedschaft für NIVO oder für sich persönlich nutzt.','Eine private Zahlung vom Geschäftsbankkonto ist eine Privatentnahme. Verändert sie den Gewinn?'],solution:'Falsch. Die Mitgliedschaft ist privat. Die Privatentnahme vermindert das Eigenkapital und ist erfolgsneutral.'},
{title:'Geld aus der Geschäftskasse',group:'Privatentnahmen',story:'Felix Neumann entnimmt 450,00 € aus der Geschäftskasse von NIVO, um damit private Ausgaben zu bezahlen.',type:'booking',debit:'3001 P',credit:'2880 KA',amount:450,tips:['Wird Geld in das Unternehmen eingebracht oder für private Zwecke entnommen?','Eine Privatentnahme steht bei 3001 P im Soll. Die Geschäftskasse nimmt ab und steht im Haben.'],solution:'3001 P 450,00 € an 2880 KA 450,00 €\nDie Privatentnahme steht im Soll; die Geschäftskasse nimmt im Haben ab.'},
{title:'Eine private Rechnung',group:'Privatentnahmen',story:'Felix hat für seine Familie ein Ferienhaus gemietet. Die Rechnung wird vom Geschäftsbankkonto bezahlt.',receipt:'Rechnung · Ferienhaus am See|Empfänger: Felix Neumann, privat|Familienurlaub · Gesamtbetrag: 1.680,00 €',type:'booking',debit:'3001 P',credit:'2800 BK',amount:1680,tips:['Für wen ist die Leistung bestimmt? Ist die Ferienhausmiete privat oder betrieblich?','Die private Zahlung steht bei 3001 P im Soll. Das Bankguthaben nimmt im Haben ab.'],solution:'3001 P 1.680,00 € an 2800 BK 1.680,00 €\nDer gesamte Betrag ist eine Privatentnahme; Vorsteuer wird nicht angesetzt.'},
{title:'Geld für NIVO',group:'Privateinlagen',story:'Felix überweist 3.200,00 € von seinem privaten Bankkonto auf das Geschäftsbankkonto von NIVO. Das Geld stammt aus seinen privaten Ersparnissen.',question:'Wie ist dieser Vorgang bei NIVO einzuordnen?',type:'choice',options:['Als Privatentnahme, weil Felix Geld von seinem privaten Konto überweist.','Als Privateinlage, weil Felix privates Geld in das Unternehmen einbringt.','Als betrieblichen Ertrag, weil das Bankguthaben steigt.','Als betrieblichen Aufwand, weil Felix Geld ausgibt.'],answer:'1',tips:['Fließt Geld aus Sicht von NIVO in das Unternehmen hinein oder aus ihm heraus?','Felix bringt privates Geld in das Unternehmen ein. Die Einlage verändert den Gewinn nicht.'],solution:'Privateinlage: Sie erhöht das Eigenkapital, ist aber erfolgsneutral.'},
{title:'Bargeld für die Geschäftskasse',group:'Privateinlagen',story:'Felix Neumann legt 800,00 € aus seinem Privatvermögen in die Geschäftskasse von NIVO ein.',type:'booking',debit:'2880 KA',credit:'3001 P',amount:800,tips:['Welche beiden Konten sind betroffen? Nimmt die Geschäftskasse zu oder ab?','2880 KA nimmt im Soll zu. Die Privateinlage steht bei 3001 P im Haben.'],solution:'2880 KA 800,00 € an 3001 P 800,00 €\nDie Kasse nimmt zu; die Einlage erhöht das Eigenkapital.'},
{title:'Überweisung an NIVO',group:'Privateinlagen',story:'Der Kontoauszug zeigt eine bestätigte Gutschrift auf dem Geschäftsbankkonto von NIVO.',receipt:'Kontoauszug · NIVO|Auftraggeber: Felix Neumann, Privatkonto|Verwendungszweck: Privateinlage aus Ersparnissen|Gutschrift: 2.750,00 €',type:'booking',debit:'2800 BK',credit:'3001 P',amount:2750,tips:['Lies den Verwendungszweck und überlege, ob das Geschäftsbankguthaben steigt oder sinkt.','2800 BK nimmt im Soll zu. Die Privateinlage steht bei 3001 P im Haben.'],solution:'2800 BK 2.750,00 € an 3001 P 2.750,00 €\nDas Geschäftsbankguthaben steigt und die Einlage wird im Haben erfasst.'},
{title:'Das Privatkonto führen',group:'T-Konto',story:'Felix entnimmt 600,00 € aus der Geschäftskasse für private Zwecke. Außerdem überweist er 2.400,00 € von seinem privaten Bankkonto auf das Geschäftsbankkonto von NIVO.',type:'tiles',question:'Buche die Vorgänge im Konto 3001 P. Gib jeweils Gegenkonto und Betrag an.',tiles:['Soll','Haben','2880 KA','2800 BK','3000 EK','600,00 €','1.800,00 €','2.400,00 €','Summe'],correct:['Soll','Haben','2880 KA','600,00 €','2800 BK','2.400,00 €','3000 EK','1.800,00 €','Summe','2.400,00 €','Summe','2.400,00 €'],tips:['Entscheide zuerst: Privatentnahme oder Privateinlage?','Entnahmen stehen im Soll, Einlagen im Haben. Der Saldo von 1.800,00 € mit 3000 EK gleicht die kleinere Seite aus. Beide Summen betragen 2.400,00 €.'],solution:'Soll: 2880 KA · 600,00 € und 3000 EK · 1.800,00 € (Saldo).\nHaben: 2800 BK · 2.400,00 €.\nSumme auf beiden Seiten: 2.400,00 €. Der Saldo gleicht das Konto aus.'},
{title:'Entnahmeüberschuss',group:'Abschluss',type:'closing',story:'Auf dem Privatkonto wurden 18.600,00 € Privatentnahmen und 11.200,00 € Privateinlagen erfasst.',amount:7400,side:'Haben',debit:'3000 EK',credit:'3001 P',effect:'sinkt',tips:['Vergleiche die Summen: Welche Seite ist größer?','Der Ausgleichsbetrag steht auf der kleineren Seite. Bei Entnahmeüberschuss: 3000 EK an 3001 P.'],solution:'18.600,00 € − 11.200,00 € = 7.400,00 € Entnahmeüberschuss.\nHaben: 3000 EK 7.400,00 €.\n3000 EK 7.400,00 € an 3001 P 7.400,00 €.\nDas Eigenkapital sinkt um 7.400,00 €.'},
{title:'Einlageüberschuss',group:'Abschluss',type:'closing',story:'Auf dem Privatkonto wurden 8.400,00 € Privatentnahmen und 13.900,00 € Privateinlagen erfasst.',amount:5500,side:'Soll',debit:'3001 P',credit:'3000 EK',effect:'steigt',tips:['Vergleiche die Summen: Welche Seite ist größer?','Der Ausgleichsbetrag steht auf der kleineren Seite. Bei Einlageüberschuss: 3001 P an 3000 EK.'],solution:'13.900,00 € − 8.400,00 € = 5.500,00 € Einlageüberschuss.\nSoll: 3000 EK 5.500,00 €.\n3001 P 5.500,00 € an 3000 EK 5.500,00 €.\nDas Eigenkapital steigt um 5.500,00 €.'},
{title:'Felix spendet für den Naturschutz',group:'Privatentnahmen',story:'Felix Neumann spendet persönlich und für private Zwecke 250,00 € aus der Geschäftskasse von NIVO.',receipt:'Spendenbescheinigung · Natur erleben München e. V.|Zuwendender: Felix Neumann, privat|Geldspende, bar: 250,00 €|Fiktiver Unterrichtsbeleg',type:'booking',debit:'3001 P',credit:'2880 KA',amount:250,tips:['Tätigt Felix die Spende für NIVO oder persönlich? Woher stammt das Geld?','Die private Spende ist eine Entnahme: 3001 P im Soll, 2880 KA im Haben.'],solution:'3001 P 250,00 € an 2880 KA 250,00 €\nDie persönliche Spende aus der Geschäftskasse ist eine erfolgsneutrale Privatentnahme.'},
{title:'Unternehmerlohn und Privatentnahme',group:'Grundlagen',story:'Emma möchte wissen, wie Felix Neumann als Inhaber von NIVO Geld für seinen Lebensunterhalt erhält.',type:'choice',question:'Welche Aussage trifft zu?',options:['Felix erhält zwingend ein festes Gehalt, das NIVO als Personalaufwand bucht.','Felix kann während des Jahres Geld für private Zwecke entnehmen. Diese Entnahmen erfolgen häufig im Vorgriff auf den erwarteten Gewinn.','Jede Privatentnahme erhöht unmittelbar den Gewinn von NIVO.','Felix darf Geld für private Zwecke nur als betrieblichen Reiseaufwand buchen.'],answer:'1',tips:['Felix ist Inhaber eines Einzelunternehmens. Wie kann er Geld für private Ausgaben erhalten?','Privatentnahmen sind erfolgsneutral und können im Vorgriff auf den erwarteten Gewinn erfolgen.'],solution:'Felix kann private Entnahmen als vorweggenommene Gewinnentnahmen vornehmen. Für seine Tätigkeit wird kein Gehalt als Personalaufwand gebucht. Entnahmen müssen nicht dem kalkulierten Unternehmerlohn entsprechen.'}

async function verifyAccess(role,password){if(!AUTH_ENDPOINT)throw Error('Die Passwortprüfung ist noch nicht eingerichtet.');let response;try{response=await fetch(AUTH_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,password}),cache:'no-store',credentials:'omit'})}catch{throw Error('Die Passwortprüfung ist momentan nicht erreichbar. Bitte erneut versuchen.')}if(!response.ok)throw Error(response.status===401?'Das Passwort stimmt nicht.':'Die Passwortprüfung ist momentan nicht verfügbar.');return response.json()}
const key='nivo-privatkonto-v2', fresh=()=>({items:tasks.map(()=>({started:false,errors:0,parts:{},shown:false})),help:false});let state;try{state=JSON.parse(sessionStorage.getItem(key))||fresh()}catch{state=fresh()}if(state.items[7]?.parts[0]?.slots?.length===4){state.items[7].parts={};sessionStorage.setItem(key,JSON.stringify(state))}let current=null,part=0,slots=[],selected=null;const app=document.getElementById('app'),dialog=document.getElementById('dialog');function save(){sessionStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isDone(i){let x=state.items[i];return tasks[i].type==='closing'?[0,1,2,3].every(p=>x.parts[p]?.done):!!x.parts[0]?.done}function stage(){let item=state.items[current];return item.parts[part]??=( {errors:0,done:false,shown:false})}function euro(n){return n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}function num(s){s=String(s).replace(/€|EUR/gi,'').replace(/\s/g,'');if(!s)return NaN;if(s.includes(',')){if(!/^\d{1,3}(?:\.\d{3})*,\d{1,2}$|^\d+,\d{1,2}$/.test(s))return NaN;s=s.replace(/\./g,'').replace(',','.')}else if(/^\d{1,3}(?:\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else if(!/^\d+(?:\.\d{1,2})?$/.test(s))return NaN;return Number(s)}function openDialog(html){dialog.innerHTML=html;dialog.showModal()}function closeDialog(){dialog.close()}

function helpDialog(){openDialog(`<h2>Lösungshilfe</h2><p>${state.help?'Die Lösungshilfe ist für diesen Tab freigeschaltet.':'Gib das Passwort deiner Lehrkraft ein. Nach drei Fehlversuchen kannst du die Musterlösung öffnen.'}</p>${state.help?'<button onclick="state.help=false;save();closeDialog();home()">Lösungshilfe ausschalten</button>':`<label>Passwort <input type="password" id="hp"></label><p id="msg"></p><button onclick="unlockHelp()">Freischalten</button>`} <button class="ghost" onclick="closeDialog()">Schließen</button>`)}async function unlockHelp(){try{await verifyAccess('help',document.getElementById('hp').value);state.help=true;save();closeDialog();home()}catch(e){document.getElementById('msg').textContent=e.message}}function teacherLogin(){openDialog(`<h2>Lehreransicht</h2><label>Passwort <input type="password" id="tp"></label><p id="msg"></p><button onclick="teacherCheck()">Anmelden</button> <button class="ghost" onclick="closeDialog()">Abbrechen</button>`)}async function teacherCheck(){try{await verifyAccess('teacher',document.getElementById('tp').value);closeDialog();teacher()}catch(e){document.getElementById('msg').textContent=e.message}}function teacher(){current=null;app.innerHTML=`<section class="panel report"><button class="ghost" onclick="home()">← Zur Auftragsmappe</button><h1>Lehreransicht</h1><p>Dieser Lernstand befindet sich nur in diesem Browser-Tab.</p><p>Lösungshilfe: <strong>${state.help?'freigeschaltet':'ausgeschaltet'}</strong></p><button class="ghost" onclick="state.help=!state.help;save();teacher()">Lösungshilfe ${state.help?'ausschalten':'freischalten'}</button><h2>Aufgabenübersicht</h2><table><thead><tr><th>Aufgabe</th><th>Stand</th><th>Fehlversuche</th><th>Lösung</th></tr></thead><tbody>${tasks.map((t,i)=>`<tr><td>${i+1}. ${esc(t.title)}</td><td>${isDone(i)?'Gelöst':state.items[i].started?'Begonnen':'Offen'}</td><td>${state.items[i].errors}</td><td>${state.items[i].shown?'Angesehen':'–'}</td></tr>`).join('')}</tbody></table><div class="actions"><button onclick="reportDialog()">Lernstand als PDF speichern</button></div></section>`}function reportDialog(){openDialog(`<h2>Lernstand exportieren</h2><p>Optional: Gib einen Namen oder ein Kürzel ein. Der Bericht wird direkt als PDF heruntergeladen. Er enthält keine Passwörter.</p><label>Name oder Kürzel <input id="student" maxlength="80"></label><button onclick="printReport()">PDF erstellen</button> <button class="ghost" onclick="closeDialog()">Abbrechen</button>`)}function printReport(){let name=document.getElementById('student').value.trim();let rows=['Lernstand: Privatkonto bei NIVO','Name / Kuerzel: '+(name||'-'),'Stand: '+new Date().toLocaleString('de-DE',{timeZone:'Europe/Berlin'}),'',...tasks.flatMap((t,i)=>[`${i+1}. ${t.title}`,`   ${isDone(i)?'Geloest':state.items[i].started?'Begonnen':'Nicht begonnen'} | Fehlversuche: ${state.items[i].errors} | Musterloesung: ${state.items[i].shown?'angesehen':'nicht angesehen'}`])];let bytes=makePdf(rows);let url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download='NIVO-Privatkonto-Lernstand.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);closeDialog()}
function makePdf(rows){let clean=s=>String(s).replace(/[–—]/g,'-').replace(/[^\x20-\xFF]/g,'?').replace(/[\\()]/g,'\\$&');let text='BT /F1 11 Tf 48 795 Td 18 TL '+rows.map((r,i)=>(i?'T* ':'')+'('+clean(r)+') Tj').join('\n')+' ET';let objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Length '+text.length+' >>\nstream\n'+text+'\nendstream'];let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((o,i)=>{offsets.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});let x=pdf.length;pdf+='xref\n0 6\n0000000000 65535 f \n'+offsets.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';return Uint8Array.from(pdf,c=>c.charCodeAt(0))}

function renderTask(){let t=tasks[current],s=stage();slots=s.slots||slots;let body='';if(t.type==='choice')body=`<p><strong>${esc(t.question)}</strong></p>${options(t.options,'choice')}`;if(t.type==='tf')body=`<p><strong>${esc(t.question)}</strong></p>${options(['Richtig','Falsch'],'truth')}<div id="reason" hidden><p>Falls die Aussage falsch ist: Welche Begründung trifft zu?</p>${options(t.options,'reason')}</div>`;if(t.type==='booking')body=bookingFields();if(t.type==='tiles')body=tileBoard(t);if(t.type==='closing'){let labels=['Saldo ermitteln','T-Konto ergänzen','Abschlussbuchungssatz bilden','Wirkung auf Eigenkapital'];body=`<p class="tag">Teil ${part+1} von 4 · ${labels[part]}</p>`+(part===0?'<label>Ermittle den Saldo: <input id="saldo" inputmode="decimal" placeholder="0,00 €"></label>':part===1?tileBoard(t,true):part===2?bookingFields():`<p>Gib an, wie sich das Eigenkapital verändert.</p>${options(['steigt','sinkt'],'effect')}`)}
app.innerHTML=`<section class="panel"><p class="tag">${esc(t.group)} · Auftrag ${current+1} von 12</p><h1>${esc(t.title)}</h1><p>${esc(t.story)}</p>${receiptMarkup(t)}${body}<div id="feedback" role="status" aria-live="polite">${s.done?'<div class="note success">✓ Richtig gelöst!</div>':s.errors?`<div class="note"><strong>Noch nicht ganz.</strong> ${esc(t.tips[Math.min(s.errors-1,1)])}</div>`:''}</div><div class="actions"><button onclick="check()">Antwort prüfen</button><button class="ghost" onclick="home()">← Zur Auftragsmappe</button>${s.errors>=3&&state.help?'<button class="ghost" onclick="showSolution()">Musterlösung anzeigen</button>':''}${t.type==='closing'&&s.done&&part<3?'<button onclick="nextPart()">Nächster Teil →</button>':''}</div>${s.errors>=3&&!state.help?'<p class="status">Die Lösungshilfe kann über die Auftragsmappe freigeschaltet werden.</p>':''}${s.shown&&state.help?`<div class="solution"><strong>Musterlösung</strong><br>${esc(partSolution(t))}</div>`:''}</section>`;restoreInputs(s);if(t.type==='tf'){app.querySelectorAll('input[name="truth"]').forEach(e=>e.addEventListener('change',toggleReason));toggleReason()}if(s.done){app.querySelectorAll('input,select, .tile,.drop').forEach(e=>{e.disabled=true;e.style.pointerEvents='none'});document.getElementById('feedback').innerHTML+=`<p>${esc(partSolution(t))}</p>`}}
function check(){let t=tasks[current],s=stage(),ok=false,missing=false;if(s.done)return;s.inputs=[...app.querySelectorAll('input,select')].map(e=>({id:e.id,name:e.name,value:e.value,checked:e.checked,type:e.type}));let radio=n=>document.querySelector(`input[name="${n}"]:checked`)?.value;let booking=()=>{let a=document.getElementById('a0').value,b=document.getElementById('a1').value,n=document.getElementById('n0').value,m=document.getElementById('n1').value;missing=!a||!b||!n.trim()||!m.trim();return a===t.debit&&b===t.credit&&num(n)===t.amount&&num(m)===t.amount};if(t.type==='choice'){let v=radio('choice');missing=v===undefined;ok=v===t.answer}if(t.type==='tf'){let v=radio('truth'),r=radio('reason');missing=v===undefined||(v==='1'&&r===undefined);ok=v==='1'&&r==='0'}if(t.type==='booking')ok=booking();if(t.type==='tiles'){missing=t.correct.some((_,i)=>!slots[i]);ok=t.correct.every((x,i)=>slots[i]===x)}if(t.type==='closing'){if(part===0){let v=document.getElementById('saldo').value;missing=!v.trim();ok=num(v)===t.amount}if(part===1){missing=!slots[0]||!slots[1]||!slots[2];ok=slots[0]==='3000 EK'&&slots[1]===euro(t.amount)&&slots[2]===t.side}if(part===2)ok=booking();if(part===3){let v=radio('effect');missing=v===undefined;ok=(v==='0'?'steigt':v==='1'?'sinkt':'')===t.effect}}if(missing){document.getElementById('feedback').innerHTML='<div class="note">Bitte beantworte zuerst alle Felder dieser Teilaufgabe.</div>';return}if(ok){s.done=true}else{s.errors++;state.items[current].errors++}save();if(t.type==='tiles'||t.type==='closing'&&part===1){/* keep placed tiles */}renderTask()}function partSolution(t){return t.type==='closing'?t.solution.split('\n')[part]:t.solution}function restoreInputs(s){for(let saved of s.inputs||[]){let els=saved.id?[document.getElementById(saved.id)]:[...app.querySelectorAll('input')].filter(e=>e.name===saved.name&&e.value===saved.value);for(let e of els){if(!e)continue;if(e.type==='radio')e.checked=saved.checked;else e.value=saved.value}}}function showSolution(){let s=stage();if(!state.help||s.errors<3)return;s.shown=true;state.items[current].shown=true;save();renderTask()}function nextPart(){part++;slots=[];chosenTile=null;selected=null;save();renderTask()}home();
</script></body></html>
